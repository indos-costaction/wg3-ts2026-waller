# .theory[Theory]
# From fMRI Preprocessing to *fMRIPrep*

---

## Why do data require preprocessing?

All analyses require consistent and accurate **spatiotemporal location**

- **Within runs:** head motion, slice timing
- **Within individuals:** coregistration between runs and with anatomy, susceptibility distortion
- **Across subjects:** spatial normalization

.source[Chris Markiewicz & Oscar Esteban, [fMRIPrep Bootcamp Geneva
2024](https://www.nipreps.org/presentations/2024-fMRIPrep-Bootcamp-Geneva/day1-01-fmriprep-primer/)]

.step.in[
### Slice timing
]

.panel[
- Most fMRI acquisitions measure slice by slice
- Slices are sampled at different times
- Slice timing interpolates each volume as if it was acquired all at once
- Should be applied before motion correction, because motion correction changes which anatomical location each voxel corresponds to
]

---

class: middle

<video src="fmri-visualization/slice-timing.webm" controls loop muted></video>
.label[After slice timing correction]
.source[NDARINVXP963GZ5 of the [Transdiagnostic Connectome Project](https://openneuro.org/datasets/ds005237)]

---

.step.in[
### Head motion correction
]

.panel[
- Participants move their head involuntarily
- The same voxel location then maps to different anatomical locations in different volumes
- Head motion correction aligns all volumes to a common spatial reference
- Estimates three translations (*x*, *y*, *z*) and three rotations (roll, pitch, yaw) for each volume
- These parameters are kept as confounds for later denoising
]

---

---

.step.in[
### Susceptibility distortion correction (SDC)
]

.panel[
- Air-tissue boundaries (sinuses, ear canals) distort the local B<sub>0</sub> field
- EPI images are stretched and compressed along the phase-encoding direction
- Information is lost in compressed regions
- Estimate a map of the B<sub>0</sub> field to derive how far each voxel was displaced
]

---

.step.in[
### Standard space
]

.panel[
- Brains differ in size, shape and position
- Normalization maps every participant to a common brain template
- In standard space, voxels correspond across participants
- The BOLD reference is co-registered to the T1w image, and the T1w image to the template
]

---

---

.step.in[
### Denoising
]

.panel[
- Motion correction leaves lingering motion effects in the signal
- Physiological signals like breathing and heartbeat, as well as scanner drift
- *fMRIPrep* generates **confound time series**, but does not remove them
- Choose a denoising strategy and regress the confound time series out
]

## *fMRIPrep* is minimal preprocessing

- Agnostic to downstream analysis: no analysis-specific steps
- Does not regress out confounds or apply smoothing
- Cross-sectional: assumes a participant's anatomy does not change between sessions
- Designed for the common case (80/20 principle)

.source[Chris Markiewicz & Oscar Esteban, [fMRIPrep Bootcamp Geneva
2024](https://www.nipreps.org/presentations/2024-fMRIPrep-Bootcamp-Geneva/day1-01-fmriprep-primer/)]

## T1w skull stripping

.qc-definition[**Skull stripping:** identify brain tissue in the T1-weighted anatomical image and exclude skull and other non-brain tissue.]

.cards.qc[
.figure.card.turquoise[
.caption[The mask outline follows the edge of the brain]
![Good skull stripping](assets/qc/skull-stripping-good.png)
]
.figure.card.red.bad[
.caption[The mask outline misses brain or includes non-brain tissue]
![Bad skull stripping](assets/qc/skull-stripping-bad.png)
]
]

.source[fMRI Open QC Project]
.source[[HALFpipe quality control protocol](https://fmri.science/halfpipe/quality-control.html)]

---

## T1w spatial normalization

.qc-definition[**Spatial normalization:** map each participant’s anatomy to a shared template so corresponding structures align.]

.cards.qc[
.figure.card.turquoise[
.caption[Template outlines match the structures of the T1w image]
![Good T1w spatial normalization](assets/qc/t1w-normalization-good.png)
]
.figure.card.red.bad[
.caption[Template and T1w image are misaligned]
![Bad T1w spatial normalization](assets/qc/t1w-normalization-bad.png)
]
]

.source[[HALFpipe quality control protocol](https://fmri.science/halfpipe/quality-control.html)]

---

## EPI tSNR

.qc-definition[**EPI:** echo-planar imaging, the acquisition used here for BOLD. **tSNR:** temporal signal-to-noise ratio — each voxel’s mean signal over time divided by its temporal standard deviation.]

.cards.qc[
.figure.card.turquoise[
.caption[Symmetric signal without drop-out or stripes]
![Good tSNR](assets/qc/tsnr-good.png)
]
.figure.card.red.bad[
.caption[Stripe artifacts in the sagittal and coronal views]
![Bad tSNR](assets/qc/tsnr-bad.png)
]
]

.source[[HALFpipe quality control protocol](https://fmri.science/halfpipe/quality-control.html)]

---

## EPI confounds

.qc-definition[**FD (framewise displacement):** estimated head movement between consecutive volumes. **DVARS:** root mean square of the voxelwise signal changes between consecutive volumes. **Carpet plot:** voxel signals over time, stacked as rows.]

.cards.qc[
.figure.card.turquoise[
.caption[No large changes in the carpet plot, low motion]
![Good carpet plot](assets/qc/confounds-good.png)
]
.figure.card.red.bad[
.caption[Sudden changes that match motion spikes]
![Bad carpet plot](assets/qc/confounds-bad.png)
]
]

.source[[HALFpipe quality control protocol](https://fmri.science/halfpipe/quality-control.html)]

---

## EPI spatial normalization

.qc-definition[**EPI spatial normalization:** align the functional image to a shared template via the participant’s anatomical image.]

.cards.qc[
.figure.card.turquoise[
.caption[Template outlines match the structures of the EPI image]
![Good EPI spatial normalization](assets/qc/epi-normalization-good.png)
]

]
